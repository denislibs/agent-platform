name: agent-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports: ['127.0.0.1:55432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent -d agent']
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    command: ['valkey-server', '--appendonly', 'yes', '--appendfsync', 'everysec', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:56379:6379']
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  garage:
    image: dxflrs/garage:v2.4.1
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef01234567
      GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_BUCKET: agent-files
    ports: ['127.0.0.1:53900:3900']
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data

  # Миграции — разовым сервисом до воркера: несколько воркеров не гоняют их наперегонки, и в образе одна команда.
  migrate:
    profiles: ['app']
    # Образ собирает сервис worker (bun run backend:build).
    image: agent-backend:dev
    command: ['bun', 'packages/db/src/migrate.ts']
    # Миграциям нужен только DATABASE_URL: секреты из .env сюда не передаются.
    environment:
      DATABASE_URL: postgres://agent:agent@postgres:5432/agent
    depends_on:
      postgres: { condition: service_healthy }
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: 'no'

  worker:
    profiles: ['app']
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    image: agent-backend:dev
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://agent:agent@postgres:5432/agent
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT: http://garage:3900
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      garage: { condition: service_started }
    # bun — PID 1: init подбирает осиротевшие дочерние процессы docker CLI.
    init: true
    # docker.sock всё равно даёт root на хосте (backlog: прокси Docker API), но сам процесс лишних прав не получает.
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    stop_grace_period: 60s

volumes:
  pgdata:
  valkeydata:
  garagemeta:
  garagedata:
