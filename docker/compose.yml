name: agent-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports: ['127.0.0.1:55432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent -d agent']
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    command: ['valkey-server', '--appendonly', 'yes', '--appendfsync', 'everysec', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:56379:6379']
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  garage:
    image: dxflrs/garage:v2.4.1
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef01234567
      GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_BUCKET: agent-files
    ports: ['127.0.0.1:53900:3900']
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data

  # Миграции — разовым сервисом до воркера: несколько воркеров не гоняют их наперегонки, и в образе одна команда.
  migrate:
    profiles: ['app']
    # Образ собирает сервис worker (bun run backend:build).
    image: agent-backend:dev
    pull_policy: never # образ собирает сервис worker
    command: ['bun', 'packages/db/src/migrate.ts']
    # Миграциям нужен только DATABASE_URL: секреты из .env сюда не передаются.
    environment:
      DATABASE_URL: postgres://agent:agent@postgres:5432/agent
    depends_on:
      postgres: { condition: service_healthy }
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: 'no'

  # Прокси Docker API (docker/docker-proxy.yml): docker.sock видит только он, воркер — разрешённые запросы.
  docker-proxy:
    extends: { file: docker-proxy.yml, service: docker-proxy }
    profiles: ['app']

  worker:
    profiles: ['app']
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      target: worker
    image: agent-backend:dev
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://agent:agent@postgres:5432/agent
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT: http://garage:3900
      # docker CLI воркера ходит в Docker через прокси, а не в docker.sock хоста.
      DOCKER_HOST: tcp://docker-proxy:2375
    networks: [default, docker-api]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      garage: { condition: service_started }
      docker-proxy: { condition: service_healthy }
    # bun — PID 1: init подбирает осиротевшие дочерние процессы docker CLI.
    init: true
    # Пользователь bun образа, корень только для чтения: песочницами воркер управляет через прокси.
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    stop_grace_period: 60s

  api:
    profiles: ['app']
    # Образ собирает сервис worker (bun run backend:build); команда — API.
    image: agent-backend:dev
    pull_policy: never # образ собирает сервис worker
    command: ['bun', 'packages/api/src/main.ts']
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://agent:agent@postgres:5432/agent
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT: http://garage:3900
      # Presigned URL открывает браузер на хосте: опубликованный порт Garage.
      S3_PUBLIC_ENDPOINT: http://localhost:53900
      BETTER_AUTH_URL: http://localhost:8080
      # Превью сайтов: хост под nginx; ключ подписи выводится из BETTER_AUTH_SECRET (.env).
      PREVIEW_HOST: preview.localhost:8080
      # Внутри контейнера — на всех интерфейсах сети compose (по умолчанию API слушает только loopback).
      API_HOST: 0.0.0.0
      API_PORT: '3000'
    # Наружу не публикуется: только через nginx.
    expose: ['3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      garage: { condition: service_started }
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    # Не root (пользователь bun образа oven/bun), корень только для чтения: API ничего не пишет на диск.
    user: bun
    read_only: true
    tmpfs: ['/tmp']
    # docker.sock не нужен: API не управляет песочницами.
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    stop_grace_period: 15s

  # Разрешает браузеру PUT в бакет по presigned URL (CORS Garage) для http://localhost:8080 и локального Vite.
  s3-cors:
    profiles: ['app']
    image: agent-backend:dev
    pull_policy: never # образ собирает сервис worker
    command: ['bun', 'packages/storage/src/cors-cli.ts']
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://agent:agent@postgres:5432/agent
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT: http://garage:3900
      BETTER_AUTH_URL: http://localhost:8080
    depends_on:
      garage: { condition: service_started }
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: 'no'

  web:
    profiles: ['app']
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    image: agent-web:dev
    environment:
      WEB_HOST: 0.0.0.0
      # Браузер открывает приложение через nginx: оттуда же идёт HMR, этот же origin в CSP.
      WEB_PUBLIC_ORIGIN: http://localhost:8080
      S3_PUBLIC_ENDPOINT: http://localhost:53900
      # Для frame-src в CSP страницы: тот же хост, что у API.
      PREVIEW_HOST: preview.localhost:8080
      VITE_CACHE_DIR: /tmp/vite
      # WEB_WATCH_POLL: '1' # если правки не доходят до HMR через bind-mount (Docker Desktop)
    # Исходники для HMR — только для чтения; зависимости остаются из образа.
    volumes:
      - ../apps/web/src:/app/apps/web/src:ro
      - ../apps/web/index.html:/app/apps/web/index.html:ro
      - ../packages/ui/src:/app/packages/ui/src:ro
      - ../packages/ui/styles:/app/packages/ui/styles:ro
      - ../packages/shared/src:/app/packages/shared/src:ro
    # Наружу не публикуется: только через nginx.
    expose: ['5173']
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    init: true
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

  nginx:
    profiles: ['app']
    image: nginxinc/nginx-unprivileged:1.28-alpine
    # Единственный опубликованный порт стека приложения, только на loopback хоста.
    ports: ['127.0.0.1:8080:8080']
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # upstream в OSS nginx резолвит имена api и web один раз при старте: ждём, пока оба здоровы. restart: true —
    # `compose restart api|web` перезапускает и nginx. Пересоздание через up nginx не трогает: если после него
    # /api/ или / отвечает 502/503 (сменился IP), — `docker compose -f docker/compose.yml --profile app restart nginx`.
    depends_on:
      api: { condition: service_healthy, restart: true }
      web: { condition: service_healthy, restart: true }
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

networks:
  default:
  # Только воркер и прокси Docker API: ни песочницы, ни остальные сервисы до прокси не дотягиваются.
  docker-api:
    internal: true

volumes:
  pgdata:
  valkeydata:
  garagemeta:
  garagedata:
