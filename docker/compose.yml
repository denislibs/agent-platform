name: agent-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports: ['127.0.0.1:55432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent -d agent']
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    command: ['valkey-server', '--appendonly', 'yes', '--appendfsync', 'everysec', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:56379:6379']
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  garage:
    image: dxflrs/garage:v2.4.1
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef01234567
      GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_BUCKET: agent-files
    ports: ['127.0.0.1:53900:3900']
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data

  # Миграции — разовым сервисом до воркера: несколько воркеров не гоняют их наперегонки, и в образе одна команда.
  migrate:
    profiles: ['app']
    # Образ собирает сервис worker (bun run backend:build).
    image: agent-backend:dev
    command: ['bun', 'packages/db/src/migrate.ts']
    # Миграциям нужен только DATABASE_URL: секреты из .env сюда не передаются.
    environment:
      DATABASE_URL: postgres://agent:agent@postgres:5432/agent
    depends_on:
      postgres: { condition: service_healthy }
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: 'no'

  worker:
    profiles: ['app']
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    image: agent-backend:dev
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://agent:agent@postgres:5432/agent
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT: http://garage:3900
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      garage: { condition: service_started }
    # bun — PID 1: init подбирает осиротевшие дочерние процессы docker CLI.
    init: true
    # docker.sock всё равно даёт root на хосте (backlog: прокси Docker API), но сам процесс лишних прав не получает.
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    stop_grace_period: 60s

  api:
    profiles: ['app']
    # Образ собирает сервис worker (bun run backend:build); команда — API.
    image: agent-backend:dev
    command: ['bun', 'packages/api/src/main.ts']
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://agent:agent@postgres:5432/agent
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT: http://garage:3900
      # Presigned URL открывает браузер на хосте: опубликованный порт Garage.
      S3_PUBLIC_ENDPOINT: http://localhost:53900
      BETTER_AUTH_URL: http://localhost:8080
      # Внутри контейнера — на всех интерфейсах сети compose (по умолчанию API слушает только loopback).
      API_HOST: 0.0.0.0
      API_PORT: '3000'
    # Наружу не публикуется: только через nginx.
    expose: ['3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      garage: { condition: service_started }
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    # Не root (пользователь bun образа oven/bun), корень только для чтения: API ничего не пишет на диск.
    user: bun
    read_only: true
    tmpfs: ['/tmp']
    # docker.sock не нужен: API не управляет песочницами.
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    stop_grace_period: 15s

  nginx:
    profiles: ['app']
    image: nginxinc/nginx-unprivileged:1.28-alpine
    # Единственный опубликованный порт стека приложения, только на loopback хоста.
    ports: ['127.0.0.1:8080:8080']
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # upstream в OSS nginx резолвит имя api один раз при старте: ждём, пока API здоров. restart: true —
    # `compose restart api` перезапускает и nginx. Пересоздание api через up nginx не трогает: если после него
    # /api/ отвечает 503 (сменился IP), — `docker compose -f docker/compose.yml --profile app restart nginx`.
    depends_on:
      api: { condition: service_healthy, restart: true }
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

volumes:
  pgdata:
  valkeydata:
  garagemeta:
  garagedata:
