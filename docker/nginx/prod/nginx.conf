# Продакшен-вариант (docker/compose.prod.yml): статика веб-приложения и /api/ → api. Образ nginx-unprivileged, корень
# только для чтения: pid, временные файлы и сгенерированные из шаблонов конфиги — в /tmp (tmpfs).
# Серверы — в /etc/nginx/templates/nginx/app.conf.template: при старте envsubst подставляет APP_HOST,
# S3_PUBLIC_ORIGIN (origin из S3_PUBLIC_ENDPOINT, docker/nginx/prod/s3-public-origin.envsh), PREVIEW_FRAME_SRC и
# PREVIEW_SERVER_NAME (из PREVIEW_HOST, docker/nginx/prod/preview-host.envsh) и пишет /tmp/nginx/app.conf
# (NGINX_ENVSUBST_OUTPUT_DIR в docker/nginx/Dockerfile).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # За TLS-балансировщиком: доверять его X-Forwarded-For, иначе лимиты (здесь и в Better Auth) считаются по IP
  # балансировщика — один общий лимит на всех. Раскомментировать и вписать адрес или подсеть балансировщика:
  # set_real_ip_from 10.0.0.0/8;
  # real_ip_header X-Forwarded-For;
  # real_ip_recursive on;

  # Путь без строки запроса: в ней ссылки входа (?token=) и коды OAuth (?code=&state=). Referer не пишем по той же
  # причине. $request_uri, а не $uri: после внутреннего перехода (try_files) $uri — уже не то, что просил клиент.
  map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
  }
  log_format app '$remote_addr [$time_local] "$request_method $request_path $server_protocol" $status '
                 '$body_bytes_sent $request_time "$http_user_agent"';
  access_log /dev/stdout app;
  # Host в access_log не пишется (метка превью несёт MAC). В error_log Host попадает в строки об ошибках уровня error (host: "…"), а с ним и метка превью
  # тоже: error_log доступен только владельцу стека, но «метки нет ни в каких логах» утверждать нельзя.

  gzip on;
  # text/javascript — тип, который ставит обработчик превью; application/javascript — сборка приложения (mime.types).
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  # Грубый предел на IP для /api/ (по пользователю — backlog): с запасом для SSE, загрузок и опроса сессии.
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_status 429;
  # Превью сайтов: одна страница тянет десятки файлов, поэтому предел частоты свой и с запасом. limit_req ограничивает
  # частоту, а не число одновременных запросов: потоки больших файлов держит limit_conn.
  limit_req_zone $binary_remote_addr zone=preview:10m rate=50r/s;
  limit_conn_zone $binary_remote_addr zone=previewconn:10m;
  limit_conn_status 429;

  upstream api {
    server api:3000;
    keepalive 16;
    # Меньше idleTimeout API (30 с): POST не попадёт в соединение, которое Bun как раз закрыл.
    keepalive_timeout 20s;
  }

  include /tmp/nginx/app.conf;
}
