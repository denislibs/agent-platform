# Единая точка входа (дорожная карта, «Весь стек в Docker за nginx»). Образ nginx-unprivileged: без root,
# поэтому pid и временные файлы — в /tmp (в compose это tmpfs, корень контейнера только для чтения).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  # Без версии nginx в заголовке Server и на страницах ошибок.
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # WebSocket HMR dev-сервера Vite: Upgrade проходит к web, обычные запросы идут с пустым Connection (keepalive).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }

  upstream web {
    server web:5173;
  }

  upstream api {
    server api:3000;
    keepalive 16;
    # Меньше, чем простой соединения у Bun (idleTimeout API — 30 с): иначе POST мог бы попасть в соединение,
    # которое Bun как раз закрыл, а неидемпотентный запрос nginx не повторяет.
    keepalive_timeout 20s;
  }

  server {
    listen 8080;
    # Только JSON: файлы браузер грузит прямо в S3 по presigned PUT (план 4a).
    client_max_body_size 1m;

    # Заголовки безопасности для /api/ и страниц ошибок nginx: add_header в location отменяет наследование, поэтому
    # location / повторяет их сам. always — и на ответах с ошибкой. CSP для JSON: ничего не грузить, не встраиваться
    # во фреймы; у страниц приложения своя CSP (её ставит Vite, apps/web/csp.ts). Referrer-Policy не no-referrer:
    # при нём браузер шлёт Origin: null в POST, и Better Auth отклонил бы запрос по проверке Origin.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      # Better Auth: исходный хост и схема (API доверяет им — он доступен только через nginx), IP клиента.
      # proxy_set_header заменяет заголовок клиента, а не дописывает к нему: подделать X-Real-IP
      # (по нему Better Auth считает лимиты) или X-Forwarded-* клиент не может.
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      # Прочие заголовки прокси от клиента не пропускаем (пустое значение убирает заголовок).
      proxy_set_header Forwarded '';
      proxy_set_header X-Forwarded-Port '';
      proxy_set_header X-Forwarded-Prefix '';
      proxy_set_header X-Forwarded-Server '';
      # SSE: события уходят клиенту сразу, соединение живёт до часа (сердцебиение API — раз в 15 с).
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      # Ошибки самого nginx (тело больше 1m, API недоступен) — в конверте API, а не HTML-страницей.
      # Ответы API с ошибкой проходят как есть: proxy_intercept_errors выключен.
      error_page 413 = @api_too_large;
      error_page 502 503 504 = @api_unavailable;
    }

    location @api_too_large {
      default_type application/json;
      return 413 '{"error":{"code":"payload_too_large","message":"payload too large"}}\n';
    }

    location @api_unavailable {
      default_type application/json;
      return 503 '{"error":{"code":"internal","message":"API is unavailable, try again later"}}\n';
    }

    # Веб-приложение: Vite dev server (план 6; статическая сборка в nginx — план 7). CSP приходит от Vite: в ней хэш
    # inline-скрипта темы, посчитанный из его текста. Остальные заголовки — те же, что у server: свой add_header
    # здесь отменяет наследование.
    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Соединение HMR молчит, пока нет правок.
      proxy_read_timeout 3600s;
      # Модули dev-сервера (предсобранные зависимости — сотни КБ) идут клиенту потоком, а не через файлы в /tmp:
      # иначе каждая холодная загрузка пишет в лог предупреждение «buffered to a temporary file».
      proxy_buffering off;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header X-Frame-Options DENY always;
    }
  }
}
